name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 跳过锁文件检查
          cache: '' 

     - name: Install dependencies
        run: |
          npm install --package-lock-only
          # 使用 --force 强制覆盖版本冲突，这是解决 react-scripts 报错最快的方法
          npm install --force
          

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 兼容 build 目录
          path: ./build

      - name: Deploy
        uses: actions/deploy-pages@v4
