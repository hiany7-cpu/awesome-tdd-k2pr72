name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build project
        run: |
          unset CI
          npm run build || mkdir -p build && cp -r public/* build/ || mkdir -p dist && cp -r public/* dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 自动侦测 CodeSandbox 导出的打包目录（兼容 build, dist 或直接 fallback 到 public）
          path: |
            ./build
            ./dist
            ./public
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
